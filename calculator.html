<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .calculator {
      width: 320px;
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .display {
      width: 100%;
      height: 80px;
      background: #0f172a;
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 2.2rem;
      text-align: right;
      padding: 10px 16px;
      margin-bottom: 16px;
      border: none;
      overflow-x: auto;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 60px;
      border: none;
      border-radius: 10px;
      font-size: 1.3rem;
      cursor: pointer;
      background: #334155;
      color: #f1f5f9;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: #475569; }
    button:active { transform: scale(0.95); }
    .operator { background: #f59e0b; color: #fff; }
    .operator:hover { background: #d97706; }
    .equals { background: #22c55e; color: #fff; }
    .equals:hover { background: #16a34a; }
    .clear { background: #ef4444; color: #fff; }
    .clear:hover { background: #dc2626; }
    .span-2 { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" id="display" value="0" readonly />
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="span-2" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let current = "";

    function updateDisplay() {
      display.value = current === "" ? "0" : current;
    }

    function appendValue(value) {
      current += value;
      updateDisplay();
    }

    function clearDisplay() {
      current = "";
      updateDisplay();
    }

    function deleteLast() {
      current = current.slice(0, -1);
      updateDisplay();
    }

    function calculate() {
      try {
        const expression = current.replace(/%/g, "/100");
        if (!expression) return;
        const result = Function('"use strict"; return (' + expression + ')')();
        current = String(Number.isFinite(result) ? result : "Error");
      } catch {
        current = "Error";
      }
      updateDisplay();
    }

    // Keyboard support
    document.addEventListener("keydown", (e) => {
      if (/[0-9+\-*/.%]/.test(e.key)) appendValue(e.key);
      else if (e.key === "Enter" || e.key === "=") calculate();
      else if (e.key === "Backspace") deleteLast();
      else if (e.key === "Escape") clearDisplay();
    });
  </script>
</body>
</html>
